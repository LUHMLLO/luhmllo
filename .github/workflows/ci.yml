name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Verify Go modules
      run: go mod verify

    - name: Build Go app
      run: go build -v ./...

    - name: Vet Go code
      run: go vet ./...

    - name: Set up Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: v1.x

    - name: Check Kit Builds
      run: |
        cd kit
        if [ -f "build.ts" ]; then
          deno run --allow-read --allow-write --allow-run build.ts
        fi
